services:
  frontend:
    container_name: ecg_marker_frontend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html:ro
    security_opt:
      - apparmor=unconfined
    # If you prefer nginx to wait until backend is ready, you could add a simple healthcheck on backend and condition here
    # condition: service_healthy

networks:
  default:
    name: ecg_marker_net
